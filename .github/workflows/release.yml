name: Release

# リリース準備 PR（prepare-release.yml が作る `chore(release): vX.Y.Z`）を squash マージすると動く。
# release-automate が draft の Release とタグを作り、続けて次の順に進む。
#   draft → MSIX のビルド・署名 → 成果物の添付 → Release から再取得して照合 → Release の公開
# リリース準備 PR 以外の main への push では、draft ジョブが skip され、後続のジョブも動かない。
#
# release-automate のタグは GITHUB_TOKEN で作られ、`push: tags` の別のワークフローを起動しない。
# そのため成果物のビルドは、タグの push ではなく、この workflow の job として行う。
#
# MSIX の manifest Version は、コミットされた値ではなく、タグから作業コピーへ注入する
# （prepare は版数ファイルを更新しないため）。
#
# 失敗したときは、同じ実行で「Re-run failed jobs」を使う（新しいタグを切らない）。

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  draft:
    if: startsWith(github.event.head_commit.message, 'chore(release):')
    uses: scottlz0310/release-automate/.github/workflows/reusable-publish-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      draft: true

  build:
    name: MSIX のビルド・署名
    needs: draft
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.draft.outputs.target_sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.403

      - uses: microsoft/setup-msbuild@v3

      - name: Resolve version from tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "タグは v<major>.<minor>.<patch> 形式であること: $env:TAG"
          }
          "version=$($env:TAG.TrimStart('v')).0" >> $env:GITHUB_OUTPUT

      - name: Set package version in Package.appxmanifest
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = "src/TachoGraphStudio.App/Package.appxmanifest"
          (Get-Content $path) | ForEach-Object {
            if ($_ -match '^\s*Version=') {
              $_ -replace 'Version="[^"]+"', ('Version="' + $env:VERSION + '"')
            } else { $_ }
          } | Set-Content $path

      - name: Restore signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:SIGNING_CERTIFICATE_BASE64) {
            throw "Secret SIGNING_CERTIFICATE_BASE64 が未設定です（scripts/New-SigningCertificate.ps1 参照）"
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx",
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))

      - name: Build MSIX (unsigned)
        shell: pwsh
        run: |
          msbuild src/TachoGraphStudio.App/TachoGraphStudio.App.csproj `
            -restore -t:Build -p:Configuration=Release -p:Platform=x64 `
            -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false `
            -p:AppxPackageDir="$env:RUNNER_TEMP\appx\"

      - name: Sign MSIX and collect release artifacts
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          New-Item -ItemType Directory dist | Out-Null

          # self-contained のため依存ランタイム msix は生成されないが、App パッケージのみを明示的に選ぶ
          $msix = Get-ChildItem "$env:RUNNER_TEMP\appx" -Recurse -Filter "TachoGraphStudio.App_*_x64.msix" |
            Where-Object { $_.DirectoryName -notmatch "Dependencies" } | Select-Object -First 1
          if (-not $msix) { throw "MSIX パッケージが生成されていません" }
          Copy-Item $msix.FullName dist/TachoGraphStudio_x64.msix

          $signtool = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windows.sdk.buildtools\*\bin\*\x64\signtool.exe" |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe が NuGet キャッシュに見つかりません" }
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\signing.pfx" `
            /p $env:SIGNING_CERTIFICATE_PASSWORD dist/TachoGraphStudio_x64.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool による署名に失敗しました" }

          $sig = Get-AuthenticodeSignature dist/TachoGraphStudio_x64.msix
          if (-not $sig.SignerCertificate) { throw "MSIX が署名されていません" }

          $pfx = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
            "$env:RUNNER_TEMP\signing.pfx", $env:SIGNING_CERTIFICATE_PASSWORD)
          [IO.File]::WriteAllBytes("$PWD/dist/TachoGraphStudio.cer", $pfx.Export("Cert"))

          $appinstaller = (Get-Content distribution/TachoGraphStudio.appinstaller.template -Raw).
            Replace("{VERSION}", $env:VERSION).
            Replace("{TAG}", $env:TAG)
          Set-Content dist/TachoGraphStudio.appinstaller $appinstaller -NoNewline

          Copy-Item scripts/Install-TachoGraphStudio.ps1 dist/

      - name: 成果物を artifact に保存
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  attach:
    name: Release へ成果物を添付
    needs: [draft, build]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 成果物を取得
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: artifact

      - name: draft の Release へ成果物を添付
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifact -type f | sort)
          # MSIX、公開証明書、.appinstaller、インストールスクリプトの 4 つ
          if [[ ${#files[@]} -ne 4 ]]; then
            echo "::error::添付する成果物が 4 つではありません: ${files[*]}"
            exit 1
          fi
          # 再実行で重複しないよう、既存の同名の asset は置き換える。
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  verify:
    name: Release の成果物を照合
    needs: [draft, attach]
    if: needs.draft.outputs.release_state == 'draft'
    runs-on: ubuntu-latest
    permissions:
      # draft の Release は、push 権限のある資格情報でないと取得できない。ここでは読み取りだけを行う。
      contents: write
    steps:
      - name: ビルドした成果物を取得
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: expected

      - name: Release から成果物を再取得して照合
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.draft.outputs.tag_name }}
        run: |
          set -euo pipefail
          mkdir actual
          gh release download "$TAG" --dir actual --repo "$GITHUB_REPOSITORY"

          mapfile -t names < <(find expected -type f -printf '%f\n' | sort)
          mapfile -t attached < <(find actual -type f -printf '%f\n' | sort)
          if [[ "${names[*]}" != "${attached[*]}" || ${#names[@]} -ne 4 ]]; then
            echo "::error::Release の asset が、ビルドの成果物と一致しません。期待: ${names[*]}、実際: ${attached[*]}"
            exit 1
          fi

          for name in "${names[@]}"; do
            expected_hash=$(sha256sum "expected/$name" | cut -d' ' -f1)
            actual_hash=$(sha256sum "actual/$name" | cut -d' ' -f1)
            if [[ "$expected_hash" != "$actual_hash" ]]; then
              echo "::error::$name の SHA-256 がビルドの成果物と一致しません"
              exit 1
            fi
          done
          echo "照合しました: ${names[*]}"

  finalize:
    needs: [draft, verify]
    if: needs.draft.outputs.release_state == 'draft'
    uses: scottlz0310/release-automate/.github/workflows/reusable-finalize-release.yml@3c860f1b178eb5b942d87c800153bc47887a7bfd # v3.2.1
    permissions:
      contents: write
    with:
      tag_name: ${{ needs.draft.outputs.tag_name }}
      target_sha: ${{ needs.draft.outputs.target_sha }}
