# NOTE: ASCII only - the codecov CLI reads this file with cp1252 on Windows
# runners and crashes on non-ASCII bytes (UnicodeDecodeError).
# Coverage drops are reported as informational and never block CI.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Exclude only the WinUI UI event boundary. A top-level ignore applies to the whole
# report (project coverage and the file view), not just patch, so MainWindow.xaml.cs -
# which also holds connection and credential logic - is intentionally not ignored.
ignore:
  - "src/TachoGraphStudio.App/Settings/SupabaseSettingsDialog.xaml.cs"

comment:
  layout: "condensed_header, diff, files"
